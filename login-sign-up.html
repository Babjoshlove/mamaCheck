<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MamaCheck Login</title>

    <link rel="stylesheet" href="css/login-sign-up.css">
    <script
        src="https://cdn.example.com/v5.3.6/script.js"
        crossorigin="anonymous"
        integrity="sha384-oqVuAfXRKap7fdgcCY5uykM6+R9GqQ8K/uxy9rx7HNQlGYl1kPzQho1wx4JwY8wC">
    </script>
    <script src="js/auth-corrected.js" defer></script>
   
</head>

<body>

<main class="container">

    <!-- LEFT SIDE -->
    <section class="hero-section">

        <header class="logo">
            <img src="images/image 12 (Colorized).svg" alt="MamaCheck Logo">
        </header>

        <div class="hero-content">
            <img src="images/Pregnant woman.svg" class="hero-image" alt="Hero Image">

            <h1>Care that reaches every doorstep.</h1>

            <p>
                One secure platform for administrators and Community Health Extension Workers
                to coordinate care, track visits, and serve communities better.
            </p>
        </div>

    </section>

    <!-- RIGHT SIDE -->
    <section class="form-section">

        <article class="auth-card">

            <header class="card-header">
                <h2>Welcome Back</h2>
                <p>Sign in to continue to your dashboard.</p>
            </header>

            <!-- ROLE SWITCH -->
            <section class="role-section">

                <label class="label-text">I AM SIGNING IN AS</label>

                <div class="role-toggle">

                    <button class="role-btn active" data-role="chew" type="button">
                        CHEW
                    </button>

                    <button class="role-btn" data-role="admin" type="button">
                        Admin
                    </button>

                </div>
            </section>

            <!-- LOGIN / SIGNUP TABS -->
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login" type="button">Login</button>
                <button class="tab-btn" data-tab="signup" type="button">Sign Up</button>
            </div>

            <!-- FORM -->
            <form id="authForm">

                <!-- SIGNUP ONLY FIELDS -->
                <div class="signup-fields">

                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" placeholder="First Name">
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" placeholder="Last Name">
                    </div>

                    <div class="form-group">
                        <label>PHC Name</label>
                        <input type="text" id="phcName" placeholder="phcName" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" placeholder="+234 800 000 0000" required>
                    </div>

                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="state" placeholder="Lagos" required>
                    </div>

                    <div class="form-group">
                        <label>LGA</label>
                        <input type="text" id="lga" placeholder="Ikeja" required>
                    </div>

                </div>

                <!-- ALWAYS VISIBLE -->
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter password" required>

                        <button type="button" id="togglePassword" class="toggle-btn">
                            <img src="images/Component 3.svg" alt="">
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Sign In as CHEW
                </button>

            </form>

            <footer class="card-footer">
                <p>
                    By continuing you agree to our
                    <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
                </p>
            </footer>

        </article>

    </section>

</main>

</body>
</html>
